name: hydra-bursa-vie
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      capital:
        description: 'Capital samanta'
        default: '10'
        required: false
      simbol:
        description: 'Simbol'
        default: 'BTC'
        required: false
permissions:
  contents: write
jobs:
  bursa-psie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: bursa-psie
        run: |
          python3 --version
          ls -la
          if [ ! -f bursa_v_mem.json ]; then echo '{"bucle":0,"J_total":0,"SDI":5,"total_retras":0,"praguri_atinse":0,"istoric_praguri":[]}' > bursa_v_mem.json; fi
          CAP="${{ inputs.capital }}"
          if [ -z "$CAP" ]; then CAP="10"; fi
          SIM="${{ inputs.simbol }}"
          if [ -z "$SIM" ]; then SIM="BTC"; fi
          python3 Bursa_PSIE.py --loop 5 --capital $CAP --simbol $SIM
          cat bursa_v_mem.json
      - name: commit
        if: always()
        run: |
          git config user.name "hydra-bot"
          git config user.email "hydra@psie.vie"
          git add -A
          git commit -m "hydra: +5 bucle samanta 10€ vie" || true
          git push || true
