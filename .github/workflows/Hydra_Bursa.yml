name: hydra-bursa-vie

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      capital:
        description: 'Capital samanta vie'
        default: '10'
        required: false
      simbol:
        description: 'Simbol'
        default: 'BTC'
        required: false

permissions:
  contents: write

jobs:
  bursa-psie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Hydra bursa cu praguri
        run: |
          echo '{"repo":"hydra-psie-bursa-v","bucle":0,"J_total":0,"SDI":5,"predictii":0,"venit_credite":0,"istoric":[],"total_retras":0,"praguri_atinse":0}' > bursa_v_mem.json || true
          echo '{"repo":"conta","bucle":0}' > contabilitate_mem.json || true
          python Bursa_PSIE.py --loop 5 --capital ${{ inputs.capital || '10' }} --simbol ${{ inputs.simbol || 'BTC' }}
          echo "--- MEMORIE ---"
          cat bursa_v_mem.json
      
      - name: Commit memorie vie
        if: always()
        run: |
          git config user.name "hydra-bot"
          git config user.email "hydra@psie.vie"
          git add -A
          git diff --staged --quiet || git commit -m "hydra: J+5 bucle samanta 10€ | prag 500/100 vie"
          git push || true
