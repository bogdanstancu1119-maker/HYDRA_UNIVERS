name: HYDRA - CURA TOTALA TOATE REPO-URILE

on:
  workflow_dispatch:

jobs:
  cura:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout HYDRA_UNIVERS
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.HYDRA_PAT }}

      - name: CURA TOATE REPO-URILE CU HYDRA_PAT
        env:
          PAT: ${{ secrets.HYDRA_PAT }}
        run: |
          set -e
          # Lista completa - toate repo-urile tale
          REPOS=(
            "HYDRA_UNIVERS"
            "hydra-core"
            "Hidra_core.deployed.py"
            "psie-arca"
            "Arca.py"
            "Oglinzi-PSIE"
            "Oglinzi-"
            "PSIE-Lab"
            "psie_engine.py"
            "PSIE-Symbiote"
            "Matricea-HTML-"
            "Pragul-"
            "PSIE_Mirror"
          )

          # Workflow-urile curate pe care le copiem
          mkdir -p /tmp/clean-workflows
          cp .github/workflows/hydra-resolver.yml /tmp/clean-workflows/ || echo "lipsa hydra-resolver"
          cp .github/workflows/j489-dispersie-generala.yml /tmp/clean-workflows/ || echo "lipsa j489"

          for REPO in "${REPOS[@]}"; do
            echo "=========================="
            echo "CURAT $REPO"
            echo "=========================="
            rm -rf /tmp/$REPO
            git clone https://x-access-token:${PAT}@github.com/bogdanstancu1119-maker/${REPO}.git /tmp/$REPO || continue
            cd /tmp/$REPO
            
            # Sterge toate workflow-urile vechi cu fail
            rm -rf .github/workflows/*.yml .github/workflows/*.yaml || true
            mkdir -p .github/workflows
            
            # Copie workflow-urile verzi
            cp /tmp/clean-workflows/*.yml .github
