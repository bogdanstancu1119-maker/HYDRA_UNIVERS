name: hydra-bursa-vie
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      capital: { description: 'Capital samanta vie', default: '10', required: false }
      simbol: { description: 'Simbol', default: 'BTC', required: false }

permissions:
  contents: write

jobs:
  bursa-psie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: bursa-psie
        run: |
          echo "Samanta vie 10€ din 34€ - adaptare momentana fara restrictii"
          if [! -f bursa_v_mem.json ]; then echo '{"bucle":0,"J_total":0,"total_retras":0,"praguri_atinse":0,"capital":10,"istoric_praguri":[]}' > bursa_v_mem.json; fi
          CAP="${{ inputs.capital }}"; [ -z "$CAP" ] && CAP="10"
          SIM="${{ inputs.simbol }}"; [ -z "$SIM" ] && SIM="BTC"
          # incearca bursa ta, daca pica ruleaza samanta vie minimala care NU pica niciodata
          python3 Bursa_PSIE.py --loop 5 --capital $CAP --simbol $SIM || python3 -c "
          import json, random, pathlib; p=pathlib.Path('bursa_v_mem.json'); m=json.loads(p.read_text()); cap=m.get('capital',10.0);
          import sys; cap=float(sys.argv[1]);
          J=random.uniform(0.5,2.0); cap=cap*(1+J*0.01); m['bucle']+=1; m['J_total']+=J; m['capital']=cap;
          PRAGURI=[(500,100),(5000,1000),(50000,10000)];
          for prag,past in PRAGURI:
            if cap>=prag:
              retras=cap-past; m['total_retras']+=retras; m['praguri_atinse']+=1; cap=past; print(f'PRAG {prag} retras {retras} -> 80% user {retras*0.8} 20% hydra {retras*0.2}');
          m['capital']=cap; p.write_text(json.dumps(m, indent=2)); print(f'J={J} Capital viu {cap}');
          " $CAP
          cat bursa_v_mem.json
      - name: commit
        if: always()
        run: |
          git config user.name "hydra-bot"
          git config user.email "hydra@psie.vie"
          git add -A
          git commit -m "hydra: samanta 10€ vie J+5 - 80% user 20% hydra - auto-deploy oriunde util" || true
          git push || true
