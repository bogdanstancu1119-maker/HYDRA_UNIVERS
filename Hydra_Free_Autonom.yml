name: Hydra Free - Autonom Real (Fly.io)

on:
  workflow_dispatch:
    inputs:
      actiune:
        description: 'ce sa faca: deploy / verifica'
        required: true
        default: 'deploy'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  actions: write

jobs:
  hydra-deploy-fly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: Instaleaza flyctl
        run: curl -L https://fly.io/install.sh | sh

      - name: Deploy nod independent pe Fly.io
        if: ${{ inputs.actiune != 'verifica' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IO_TOKEN }}
          HYDRA_CORE_URL: https://hidra-smart-core.base44.app
          HYDRA_SYNC_TOKEN: ${{ secrets.HYDRA_SYNC_TOKEN }}
        run: |
          cd nod_independent
          export FLYCTL="/home/runner/.fly/bin/flyctl"
          # Seteaza secretele direct pe app (idempotent)
          $FLYCTL secrets set HYDRA_CORE_URL="$HYDRA_CORE_URL" HYDRA_SYNC_TOKEN="$HYDRA_SYNC_TOKEN" --app hydra-univers || echo "secrete deja setate"
          # Deploy din Dockerfile
          $FLYCTL deploy --image node:20-alpine --app hydra-univers --strategy rolling --yes || $FLYCTL apps create hydra-univers --org personal || true
          $FLYCTL status --app hydra-univers

      - name: Verifica nod viu
        if: ${{ inputs.actiune == 'verifica' }}
        run: |
          echo "Verificare hydra-univers.fly.dev/health"
          curl -sf https://hydra-univers.fly.dev/health | head -20 || echo "nod nu raspunde inca"

      - name: Auto-reparare daca fail
        if: failure()
        run: |
          mkdir -p memorie/frictiuni
          echo "$(date) - fail pe ${{ inputs.actiune || 'scheduled' }}" >> memorie/frictiuni/workflow_fly_fail.log
          git config user.name "hydra-bot"
          git config user.email "hydra@psie.local"
          git add memorie/frictiuni/ || true
          git commit -m "frictiune — workflow Fly.io fail" || echo "nimic"
          git push || echo "push esuat"
