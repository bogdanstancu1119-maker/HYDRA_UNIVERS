name: HYDRA Deploy + Aliniere RU

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Cloudflare Workers Gratuit
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: deploy --name hydra-psie

      - name: Aliniere Platforme RU + EU
        run: |
          node -e "
          const platforme = [
            { nume: 'Cloudflare Workers', regiune: 'EU/US', cost: 0, status: 'activ' },
            { nume: 'GitHub Actions', regiune: 'EU/US', cost: 0, status: 'activ' },
            { nume: 'Yandex Cloud', regiune: 'RU', cost: 0, status: 'include ca info, nu plati din EU' },
            { nume: 'VK Cloud', regiune: 'RU', cost: 0, status: 'include ca info, nu plati din EU' },
            { nume: 'Wise HYDRA Jar', regiune: 'EU', sold: 39.68, liber: 19.84 }
          ];
          console.log('=== ALINIERE COMPLETA ===');
          console.table(platforme);
          console.log('Regula: 50% liber, sold >=0, include tot gratuit');
          "

      - name: Heartbeat HYDRA
        run: node Hydra_final_complet.js || echo "ruleaza din cache"

      - name: Salveaza progres
        run: |
          git config user.name "HYDRA"
          git config user.email "hydra@psie.local"
          git add .
          git commit -m "deploy live + aliniere RU/EU + sold 39.68" || true
          git push || true
