name: HYDRA Deploy + Aliniere RU

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Cloudflare Workers Gratuit
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: deploy --name hydra-psie
    const PLATFORME = {
  cloudflare: { nume: 'Cloudflare', limita: 100000, ramas: 99000, cost: 0, prio: 1, reg: 'EU' },
  netlify: { nume: 'Netlify', limita: 125000, ramas: 120000, cost: 0, prio: 2, reg: 'EU' },
  yandex: { 
    nume: 'Yandex Cloud', 
    limita: 999999, 
    ramas: 999999, 
    cost: 0, 
    prio: 3, 
    reg: 'RU', 
    act: 'deploy_autorizat_daca_gratis',
    conditii: {
      autorizare_scrisa: true, // email de la ei ca e gratis
      fara_card: true,
      fara_date_personale_EU: true,
      doar_cod_open_source: true,
      aliniere_PSIE: true
    }
  },
  github: { nume: 'GitHub', limita: 0, ramas: 0, cost: 0, prio: 99, reg: 'EU', act: 'skip' }
};

function poateFaceDeployRU(platforma, autorizare) {
  if (platforma.reg !== 'RU') return true; // EU/US liber
  // RU: doar daca e gratis + autorizat
  if (platforma.cost === 0 && autorizare.gratuit === true && autorizare.scrisa === true) {
    console.log(`[PSIE ALINIERE RU] Autorizat gratis pe ${platforma.nume} - deploy permis`);
    return true;
  }
  console.log(`[PSIE RU] ${platforma.nume} -> info_only, fara autorizare gratuita`);
  return false;
}
      - name: Aliniere Platforme RU + EU
        run: |
          node -e "
          const platforme = [
            { nume: 'Cloudflare Workers', regiune: 'EU/US', cost: 0, status: 'activ' },
            { nume: 'GitHub Actions', regiune: 'EU/US', cost: 0, status: 'activ' },
            { nume: 'Yandex Cloud', regiune: 'RU', cost: 0, status: 'include ca info, nu plati din EU' },
            { nume: 'VK Cloud', regiune: 'RU', cost: 0, status: 'include ca info, nu plati din EU' },
            { nume: 'Wise HYDRA Jar', regiune: 'EU', sold: 39.68, liber: 19.84 }
          ];
          console.log('=== ALINIERE COMPLETA ===');
          console.table(platforme);
          console.log('Regula: 50% liber, sold >=0, include tot gratuit');
          "

      - name: Heartbeat HYDRA
        run: node Hydra_final_complet.js || echo "ruleaza din cache"

      - name: Salveaza progres
        run: |
          git config user.name "HYDRA"
          git config user.email "hydra@psie.local"
          git add .
          git commit -m "deploy live + aliniere RU/EU + sold 39.68" || true
          git push || true
